<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달려라 삼전 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        input[type="text"], input[type="password"], select {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #60a5fa;
            font-weight: bold;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .news-card {
            background-color: #1e293b;
            border-radius: 0.5rem;
            padding: 1rem;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .news-content {
            overflow-y: auto;
            flex-grow: 1;
        }

        .news-item {
            margin-bottom: 0.6rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.4rem;
        }
        
        .news-link {
            color: #cbd5e1;
            font-size: 0.92rem;
            transition: color 0.2s;
            display: block;
            line-height: 1.4;
            text-decoration: none;
            cursor: pointer;
        }
        .news-link:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        .calc-table th, .calc-table td {
            border: 1px solid #334155;
            padding: 0.5rem;
        }
        .calc-table th {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            font-weight: 500;
        }
        .text-center { text-align: center !important; }
        .bg-yellow-alert { background-color: #eab308; color: #000; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg">
                <i class="fas fa-chart-line text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wider">달려라 삼전 <span class="text-blue-400 text-lg">STUDIO</span></h1>
        </div>
        
        <div class="flex gap-2">
            <button onclick="switchTab('dashboard')" id="tab-dashboard" class="tab-btn active px-5 py-2 rounded-md transition-colors text-slate-300 bg-slate-700 hover:bg-slate-600 text-sm">
                <i class="fas fa-tv mr-2"></i>대시보드
            </button>
            <button onclick="switchTab('calculator')" id="tab-calculator" class="tab-btn px-5 py-2 rounded-md transition-colors text-slate-300 bg-slate-700 hover:bg-slate-600 text-sm">
                <i class="fas fa-calculator mr-2"></i>자금 관리 계산기
            </button>
        </div>
        
        <div class="text-sm text-slate-400 font-mono" id="clock">
            0000. 00. 00 00:00:00
        </div>
    </header>

    <main class="flex-1 overflow-auto p-4">
        
        <!-- 대시보드 탭 -->
        <section id="content-dashboard" class="h-full flex flex-col gap-4">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 shrink-0">
                <div class="lg:col-span-12 grid grid-cols-2 gap-3">
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex flex-col justify-center">
                        <div class="text-slate-400 text-xs mb-1">마이크론 (MU)</div>
                        <div class="text-lg font-bold text-white" id="idx-micron">조회 중...</div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex flex-col justify-center">
                        <div class="text-slate-400 text-xs mb-1">샌디스크 (WDC / 대형반도체)</div>
                        <div class="text-lg font-bold text-white" id="idx-sandisk">조회 중...</div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 grid-rows-2 gap-4 h-full min-h-[500px]">
                <div class="news-card">
                    <h3 class="text-lg font-bold text-yellow-400 mb-3 border-b border-slate-600 pb-2 flex justify-between items-center">
                        <span>반도체 및 수출</span><i class="fas fa-microchip"></i>
                    </h3>
                    <div class="news-content" id="list-semi">로딩 중...</div>
                </div>
                <div class="news-card">
                    <h3 class="text-lg font-bold text-emerald-400 mb-3 border-b border-slate-600 pb-2 flex justify-between items-center">
                        <span>채권금리</span><i class="fas fa-percent"></i>
                    </h3>
                    <div class="news-content" id="list-bond">로딩 중...</div>
                </div>
                <div class="news-card">
                    <h3 class="text-lg font-bold text-pink-400 mb-3 border-b border-slate-600 pb-2 flex justify-between items-center">
                        <span>기준금리</span><i class="fas fa-university"></i>
                    </h3>
                    <div class="news-content" id="list-base">로딩 중...</div>
                </div>
                <div class="news-card">
                    <h3 class="text-lg font-bold text-blue-400 mb-3 border-b border-slate-600 pb-2 flex justify-between items-center">
                        <span>연준(Fed) 관련</span><i class="fas fa-landmark"></i>
                    </h3>
                    <div class="news-content" id="list-fed">로딩 중...</div>
                </div>
                <div class="news-card">
                    <h3 class="text-lg font-bold text-orange-400 mb-3 border-b border-slate-600 pb-2 flex justify-between items-center">
                        <span>삼성 매출/실적/기업분석</span><i class="fas fa-building"></i>
                    </h3>
                    <div class="news-content" id="list-samsung">로딩 중...</div>
                </div>
                <div class="news-card">
                    <h3 class="text-lg font-bold text-purple-400 mb-3 border-b border-slate-600 pb-2 flex justify-between items-center">
                        <span>신용/대출/마진잔고</span><i class="fas fa-exclamation-triangle"></i>
                    </h3>
                    <div class="news-content" id="list-credit">로딩 중...</div>
                </div>
            </div>
        </section>

        <!-- 자금 관리 계산기 탭 -->
        <section id="content-calculator" class="h-full hidden flex flex-col gap-6 max-w-6xl mx-auto w-full pt-4">
            <!-- (생략: 계산기 UI 동일) -->
        </section>

    </main>

    <script>
        // (생략: 스크립트 기능 유지)

    </script>
</body>
</html>
