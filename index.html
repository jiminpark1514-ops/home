<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달려라 삼전 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1e293b; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        
        /* 뉴스 박스 스타일 */
        .news-box { background-color: #1e293b; border-radius: 0.5rem; border: 1px solid #334155; display: flex; flex-direction: column; height: 400px; }
        .news-header { padding: 1rem; border-bottom: 1px solid #334155; font-weight: bold; color: #60a5fa; display: flex; justify-content: space-between; align-items: center; }
        .news-content { padding: 1rem; overflow-y: auto; flex-grow: 1; }
        .news-item { margin-bottom: 0.75rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .news-link { color: #cbd5e1; font-size: 0.9rem; transition: color 0.2s; display: block; }
        .news-link:hover { color: #3b82f6; }
        .news-date { font-size: 0.75rem; color: #64748b; font-family: monospace; }
    </style>
</head>
<body class="h-screen flex flex-col p-4">

    <!-- 헤더 -->
    <header class="mb-4 flex justify-between items-center bg-slate-800 p-4 rounded-lg border border-slate-700">
        <h1 class="text-xl font-bold text-white"><i class="fas fa-chart-line text-blue-500 mr-2"></i>달려라 삼전 NEWS DASHBOARD</h1>
        <div id="clock" class="text-slate-400 font-mono">0000.00.00 00:00:00</div>
    </header>

    <!-- 뉴스 그리드 (4분할) -->
    <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 flex-grow">
        
        <!-- 1. 반도체/수출 -->
        <section class="news-box" id="box-semiconductor">
            <div class="news-header"><span>반도체 및 수출입</span><i class="fas fa-microchip"></i></div>
            <div class="news-content" id="list-semiconductor">로딩 중...</div>
        </section>

        <!-- 2. 기준금리/채권/연준 -->
        <section class="news-box" id="box-fed">
            <div class="news-header"><span>기준금리/채권/연준(Fed)</span><i class="fas fa-university"></i></div>
            <div class="news-content" id="list-fed">로딩 중...</div>
        </section>

        <!-- 3. 삼성분석 -->
        <section class="news-box" id="box-samsung">
            <div class="news-header"><span>삼성전자 매출/실적/분석</span><i class="fas fa-building"></i></div>
            <div class="news-content" id="list-samsung">로딩 중...</div>
        </section>

        <!-- 4. 신용/대출/마진 -->
        <section class="news-box" id="box-credit">
            <div class="news-header"><span>신용/대출/마진잔고(시장리스크)</span><i class="fas fa-exclamation-triangle"></i></div>
            <div class="news-content" id="list-credit">로딩 중...</div>
        </section>

    </main>

    <script>
        // 뉴스 데이터를 가져오는 공통 함수
        async function fetchNews(query, containerId) {
            const container = document.getElementById(containerId);
            try {
                const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=ko&gl=KR&ceid=KR:ko`;
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await response.json();
                
                if(data.items && data.items.length > 0) {
                    container.innerHTML = data.items.slice(0, 8).map(item => `
                        <div class="news-item">
                            <a href="${item.link}" target="_blank" class="news-link">${item.title}</a>
                            <div class="news-date">${new Date(item.pubDate).toLocaleDateString()}</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-slate-500">관련 뉴스 없음</p>';
                }
            } catch (err) {
                container.innerHTML = '<p class="text-red-500">불러오기 실패</p>';
            }
        }

        // 각 영역별 자동 실행
        window.onload = () => {
            fetchNews('반도체 수출', 'list-semiconductor');
            fetchNews('기준금리 채권금리 연준', 'list-fed');
            fetchNews('삼성전자 매출 실적 기업분석', 'list-samsung');
            fetchNews('주식 신용잔고 대출 마진잔고', 'list-credit');
        };

        // 시계
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
